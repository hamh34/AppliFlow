# Copy this file to config.toml and fill in your own values.
# config.toml is gitignored, so your spreadsheet ID stays out of the repo.

# From your sheet's URL:
# https://docs.google.com/spreadsheets/d/THIS_PART_HERE/edit
spreadsheet_id = "paste-your-spreadsheet-id-here"

# Tab name inside the spreadsheet.
worksheet = "Applications"

# How far back `scan` reads Gmail, in days.
lookback_days = 90

# `followups` flags anything with no movement for this many days.
followup_days = 14

# Optional: override the Gmail search entirely. Leave commented out to use the
# built-in query, which looks for the usual application phrases. Useful if you
# file recruiting mail under a label, e.g. "label:job-hunt newer_than:90d".
# gmail_query = ""

# Optional: paths relative to this file. Defaults shown.
# credentials_file = "credentials.json"
# token_file = "token.json"


# --- Finding new openings (`appliflow find`) --------------------------------
# Pulls from official public job-board APIs. No API key, no scraping.
[find]
# Title must contain one of these -- a plain substring match, not whole words.
# That is why the entries below are word *stems*: "sustainab" catches both
# "Sustainability Analyst" and "Sustainable Finance Officer" in one entry.
# Indonesian terms are here on purpose: local boards post in Indonesian.
# Empty list = no keyword filter.
keywords = [
    "sustainab",      # sustainability, sustainable
    "keberlanjutan",
    "esg",
    "climate",
    "iklim",
    "environment",    # environment, environmental
    "lingkungan",
    "emission",
    "emisi",
    "carbon",         # also matches "hydrocarbon" -- oil and gas noise
    "karbon",
    "green finance",
    "green econom",
    "renewable",
    "terbarukan",
]

# Location substring match. "remote" also matches roles flagged remote.
# Postings whose location could not be parsed are kept, not dropped.
# Empty list = anywhere.
locations = ["Jakarta", "Indonesia", "Remote"]

# Ignore postings older than this. 0 = no age limit.
max_age_days = 30

# Tab the results are written to. Created automatically if missing.
worksheet = "Openings"

# Company job boards. The token is the company's handle in its careers URL:
#   boards.greenhouse.io/TOKEN     -> greenhouse
#   jobs.lever.co/TOKEN            -> lever
#   jobs.ashbyhq.com/TOKEN         -> ashby
# Look at a company's careers page to see which one they use.
greenhouse = []
lever = []
ashby = []

# Aggregators of remote roles. No key needed. Set true to include.
arbeitnow = false
remoteok = false

# Read openings out of job-alert emails already in your inbox.
# Set up alerts on LinkedIn / JobStreet / Glints / Kalibrr / Glassdoor first,
# with frequency set to Daily and email delivery (not just in-app) turned on.
# Uses the Gmail access AppliFlow already has - no new permission needed.
[find.alerts]
enabled = false

# How far back to search your inbox each run.
lookback_days = 7

# Limit to specific boards, e.g. ["linkedin", "kalibrr"].
# Empty = every board AppliFlow can parse.
boards = []

# Cap on alert emails read per run.
max_emails = 200
